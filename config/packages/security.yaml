security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # clients have accounts for the website, not for the CRM
            user_checker: App\Security\StaffOnlyUserChecker

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: admin_dashboard
            logout:
                path: /logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600 # 2 weeks
            # Brute-force protection: after 5 failed attempts (per email+IP) login is blocked
            # for the rest of the 15-minute window; also caps attempts per IP across all emails.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Admin > super manager: an admin can do everything a super manager can
    role_hierarchy:
        ROLE_ADMIN: [ROLE_SUPER_MANAGER]
        ROLE_SUPER_MANAGER: [ROLE_USER]
        # website client: documents and photo reports in the personal account
        ROLE_CLIENT: [ROLE_USER]

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/users, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_SUPER_MANAGER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
