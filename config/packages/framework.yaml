# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # The Next.js website calls the API from its server on behalf of visitors and passes their address
    # in X-Forwarded-For: trusting it keeps login throttling and order limits per visitor, not per website
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto']

    # Host names served (APP_TRUSTED_HOSTS, set in .env.prod); unset or empty = any host, as dev wants
    trusted_hosts: ['%env(default::APP_TRUSTED_HOSTS)%']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
