<VirtualHost *:80>
    ServerName redbox.local
    ServerAlias www.redbox.local

    # НАПРАВЛЯЕМ СРАЗУ В PUBLIC (без этого Symfony выдаст ошибку или откроет корень)
    DocumentRoot /var/www/redbox/public

    <Directory /var/www/redbox/public>
        # Разрешаем доступ к папке
        Require all granted

        # Запрещаем переопределение через .htaccess (лучше для производительности)
        AllowOverride None

        # Если файл или папка не существуют, Apache сразу стучится в index.php
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/redbox_error.log
    CustomLog ${APACHE_LOG_DIR}/redbox_access.log combined
</VirtualHost>
